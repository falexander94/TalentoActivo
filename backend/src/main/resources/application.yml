server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: talento-activo-backend
  datasource:
    url: jdbc:mysql://localhost:3306/talento_activo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:27227794#Dec94}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
