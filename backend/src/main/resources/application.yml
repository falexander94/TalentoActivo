          issuer-uri: https://dev-8xlvbif4xugov43x.us.auth0.com/

auth0:
  audience: ${AUTH0_AUDIENCE:https://api.talentoactivo.com}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
